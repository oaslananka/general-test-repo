name: Free Provider Smoke Test

on:
  workflow_dispatch:
    inputs:
      strict:
        description: "Fail if any configured provider fails"
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main
      - ai/free-coding-stack-20260922
      - ai/expand-zero-cost-providers-20260922
      - ai/test-more-keyless-free-20260922
    paths:
      - opencode.json
      - scripts/provider-smoke.sh
      - scripts/free-ai-agent.sh
      - .github/workflows/provider-smoke.yml
      - .github/workflows/free-ai-agent.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ${{ vars.AI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      INCEPTION_API_KEY: ${{ secrets.INCEPTION_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      HETZNER_VLLM_API_KEY: ${{ secrets.HETZNER_VLLM_API_KEY }}
      AION_API_KEY: ${{ secrets.AION_API_KEY }}
      FREEINFERENCE_API_KEY: ${{ secrets.FREEINFERENCE_API_KEY }}
      REQUESTY_API_KEY: ${{ secrets.REQUESTY_API_KEY }}
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      CLOUDFLARE_FREE_ONLY: ${{ vars.CLOUDFLARE_FREE_ONLY }}
      MISTRAL_FREE_ONLY: ${{ vars.MISTRAL_FREE_ONLY }}
      GEMINI_FREE_ONLY: ${{ vars.GEMINI_FREE_ONLY }}
      AI_OLLAMA_MODEL: ${{ vars.AI_OLLAMA_MODEL }}
      STRICT_PROVIDER_SMOKE: ${{ github.event_name == 'workflow_dispatch' && inputs.strict || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install current CLIs
        run: |
          set -euo pipefail
          npm install --global @opencode/cli @kilocode/cli
          opencode --version
          kilo --version

      - name: Validate agent scripts
        shell: bash
        run: |
          bash -n scripts/provider-smoke.sh
          bash -n scripts/free-ai-agent.sh

      - name: Verify challenge is initially failing
        shell: bash
        run: |
          set +e
          npm --prefix challenge test
          rc=$?
          set -e
          if [[ $rc -eq 0 ]]; then
            echo "The intentionally broken challenge unexpectedly passed."
            exit 1
          fi
          echo "Intentional failing challenge confirmed."

      - name: Smoke-test configured free providers
        shell: bash
        run: bash scripts/provider-smoke.sh
